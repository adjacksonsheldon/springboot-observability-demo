spring:
  application:
    name: springboot-observability-demo

  graphql:
    graphiql:
      enabled: true

  datasource:
    url: ${DB_HOST:jdbc:mysql://localhost:3306/catalog?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
    username: dev
    password: dev123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

management:
  endpoint:
    health:
      probes:
        enabled: true

logging:
  file:
    name: /app/logs/application.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger - %msg%n"